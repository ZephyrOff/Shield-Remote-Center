[versions]
androidGradlePlugin = "9.4.1"
androidxAnnotation = "1.11.0"
kmqtt = "1.0.0"
java-websocket = "1.5.7"
kotlin = "2.4.21"
media3 = "1.6.1"
kotlinx-coroutines = "1.11.0"
metro = "1.4.5"

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }

[libraries]
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
kmqtt-common = { group = "io.github.davidepianca98", name = "kmqtt-common-jvm", version.ref = "kmqtt" }
kmqtt-client = { group = "io.github.davidepianca98", name = "kmqtt-client-jvm", version.ref = "kmqtt" }
java-websocket = { group = "org.java-websocket", name = "Java-WebSocket", version.ref = "java-websocket" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", "name" = "kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
