send_popup:
  target:
    entity:
      integration: shield_remote_center
      domain: media_player
  fields:
    primary:
      required: true
      example: "Someone is at the gate"
      selector:
        text:
    secondary:
      example: "Open it from the TV?"
      selector:
        text:
    camera_entity:
      selector:
        entity:
          filter:
            - domain: camera
            - domain: image
    refresh_rate:
      default: 1
      selector:
        number:
          min: 0.5
          max: 10
          step: 0.5
          unit_of_measurement: s
