send_toast:
  target:
    entity:
      integration: shield_remote_center
      domain: media_player
  fields:
    primary:
      required: true
      example: "Washing machine finished"
      selector:
        text:
    secondary:
      example: "The laundry can be taken out"
      selector:
        text:
    icon:
      example: "mdi:washing-machine"
      selector:
        icon:
    color:
      selector:
        color_rgb:
    timeout:
      default: 8
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: box
    button_1:
      collapsed: false
      fields:
        label:
          selector:
            text:
        action:
          selector:
            action:
        dismiss:
          default: true
          selector:
            boolean:
    button_2:
      collapsed: true
      fields:
        label:
          selector:
            text:
        action:
          selector:
            action:
        dismiss:
          default: true
          selector:
            boolean:
    button_3:
      collapsed: true
      fields:
        label:
          selector:
            text:
        action:
          selector:
            action:
        dismiss:
          default: true
          selector:
            boolean:
    button_4:
      collapsed: true
      fields:
        label:
          selector:
            text:
        action:
          selector:
            action:
        dismiss:
          default: true
          selector:
            boolean:

