send_toast:
  target:
    entity:
      integration: shield_remote_center
      domain: media_player
  fields:
    primary:
      required: true
      example: "Washing machine finished"
      selector:
        text:
    secondary:
      example: "The laundry can be taken out"
      selector:
        text:
    icon:
      example: "mdi:washing-machine"
      selector:
        icon:
    color:
      selector:
        color_rgb:
    timeout:
      default: 8
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: s
          mode: box
    button_1:
      collapsed: false
      fields:
        button_1_label:
          selector:
            text:
        button_1_type:
          selector:
            select:
              translation_key: button_type
              options:
                - close
                - script
                - toggle
                - turn_on
                - turn_off
                - automation
                - action
        button_1_entity:
          selector:
            entity:
              filter:
                - domain:
                    - script
                    - automation
                    - input_boolean
                    - switch
                    - light
                    - fan
                    - cover
                    - lock
                    - scene
        button_1_action:
          selector:
            action:
        button_1_dismiss:
          default: true
          selector:
            boolean:
    button_2:
      collapsed: true
      fields:
        button_2_label:
          selector:
            text:
        button_2_type:
          selector:
            select:
              translation_key: button_type
              options:
                - close
                - script
                - toggle
                - turn_on
                - turn_off
                - automation
                - action
        button_2_entity:
          selector:
            entity:
              filter:
                - domain:
                    - script
                    - automation
                    - input_boolean
                    - switch
                    - light
                    - fan
                    - cover
                    - lock
                    - scene
        button_2_action:
          selector:
            action:
        button_2_dismiss:
          default: true
          selector:
            boolean:
    button_3:
      collapsed: true
      fields:
        button_3_label:
          selector:
            text:
        button_3_type:
          selector:
            select:
              translation_key: button_type
              options:
                - close
                - script
                - toggle
                - turn_on
                - turn_off
                - automation
                - action
        button_3_entity:
          selector:
            entity:
              filter:
                - domain:
                    - script
                    - automation
                    - input_boolean
                    - switch
                    - light
                    - fan
                    - cover
                    - lock
                    - scene
        button_3_action:
          selector:
            action:
        button_3_dismiss:
          default: true
          selector:
            boolean:
    buttons:
      example: '[{"label": "Open the gate", "action": [{"action": "script.open_gate"}]}]'
      selector:
        object:

